<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Review Form</title>
  <meta name="description" content="WDD 131 - Dynamic Web Fundamentals - product review form by Ezequiel Lezcano, student at BYU-Idaho, Argentina.">
  <meta name="author" content="Ezequiel Lezcano">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/form.css" />
  <script src="scripts/products.js" defer></script>
</head>
<body>

  <div class="page-wrapper">
    <header class="site-header">
      <div class="header-inner">
        <div class="logo">&#9733; ReviewHub</div>
        <p class="tagline">Share your experience. Help others decide.</p>
      </div>
    </header>

    <main class="main-content">
      <div class="form-card">
        <div class="form-card-header">
          <h1>Product Review</h1>
          <p>Tell us what you think about your purchase</p>
        </div>

        <form method="get" action="review.html" class="review-form" novalidate>

          <div class="field-group">
            <label for="product-name">Product Name <span class="required">*</span></label>
            <div class="select-wrapper">
              <select id="product-name" name="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
              </select>
              <span class="select-icon">&#9660;</span>
            </div>
          </div>

          <div class="field-group">
            <fieldset class="rating-fieldset">
              <legend>Overall Rating <span class="required">*</span></legend>
              <div class="star-rating">
                <input type="radio" id="star5" name="rating" value="5" required />
                <label for="star5" title="5 stars">&#9733;</label>

                <input type="radio" id="star4" name="rating" value="4" />
                <label for="star4" title="4 stars">&#9733;</label>

                <input type="radio" id="star3" name="rating" value="3" />
                <label for="star3" title="3 stars">&#9733;</label>

                <input type="radio" id="star2" name="rating" value="2" />
                <label for="star2" title="2 stars">&#9733;</label>

                <input type="radio" id="star1" name="rating" value="1" />
                <label for="star1" title="1 star">&#9733;</label>
              </div>
            </fieldset>
          </div>

          <div class="field-group">
            <label for="install-date">Date of Installation <span class="required">*</span></label>
            <input type="date" id="install-date" name="installDate" required />
          </div>

          <div class="field-group">
            <fieldset class="checkbox-fieldset">
              <legend>Useful Features <span class="hint">(select all that apply)</span></legend>
              <div class="checkbox-grid">
                <div class="checkbox-item">
                  <input type="checkbox" id="feat-easy" name="features" value="Easy to Use" />
                  <label for="feat-easy">Easy to Use</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" id="feat-durable" name="features" value="Durable" />
                  <label for="feat-durable">Durable</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" id="feat-value" name="features" value="Good Value" />
                  <label for="feat-value">Good Value</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" id="feat-performance" name="features" value="High Performance" />
                  <label for="feat-performance">High Performance</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" id="feat-support" name="features" value="Great Support" />
                  <label for="feat-support">Great Support</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" id="feat-design" name="features" value="Sleek Design" />
                  <label for="feat-design">Sleek Design</label>
                </div>
              </div>
            </fieldset>
          </div>

          <div class="field-group">
            <label for="written-review">Written Review <span class="hint">(optional)</span></label>
            <textarea id="written-review" name="writtenReview" rows="5" placeholder="Share your experience with this product..."></textarea>
          </div>

          <div class="field-group">
            <label for="user-name">Your Name <span class="hint">(optional)</span></label>
            <input type="text" id="user-name" name="userName" placeholder="e.g. Jane Doe" />
          </div>

          <div class="field-group submit-group">
            <input type="submit" value="Submit Review &#9654;" class="submit-btn" />
          </div>

        </form>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
         <p>
        &copy; <span id="currentyear"></span> 🦁 Ezequiel Lezcano 🦁 - Argentina
    </p>
    <p id="lastModified"></p>
      </div>
    </footer>
  </div>

</body>
</html>
