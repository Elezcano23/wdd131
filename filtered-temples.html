<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" >
  <meta name="viewport" content="width=device-width, initial-scale=1.0" >
  <meta name="description" content="Temple Album - A collection of LDS temples from around the world" />
  <meta name="author" content="Ezequiel Lezcano" />
  <title>Temple Album | WDD 131</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/filtered-temples.css" />
  <link rel="stylesheet" href="styles/filtered-temples-large.css" />
  <script src="scripts/filtered-temples.js" defer></script>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-symbol">✦</span>
        <span class="logo-text">Temple Album</span>
      </div>
      <nav class="main-nav" aria-label="Temple filters">
        <ul>
          <li><a href="#" class="nav-link active" data-filter="home">Home</a></li>
          <li><a href="#" class="nav-link" data-filter="old">Old</a></li>
          <li><a href="#" class="nav-link" data-filter="new">New</a></li>
          <li><a href="#" class="nav-link" data-filter="large">Large</a></li>
          <li><a href="#" class="nav-link" data-filter="small">Small</a></li>
        </ul>
      </nav>
      <button class="menu-toggle" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>
 
  <main>
    <section class="hero">
      <div class="hero-text">
        <p class="hero-eyebrow">A collection of</p>
        <h1 class="hero-title">Temples<br /><em>of the World</em></h1>
        <p class="hero-sub">Sacred places of peace, light, and devotion.</p>
      </div>
      <div class="hero-accent" aria-hidden="true">
        <div class="accent-circle c1"></div>
        <div class="accent-circle c2"></div>
      </div>
    </section>
 
    <section class="filter-label-bar">
      <p>Showing: <strong id="filter-label">All temples</strong></p>
      <span id="count-badge">0 temples</span>
    </section>
 
    <section class="gallery" id="gallery" aria-live="polite" aria-label="Temple gallery">
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-brand">✦ Temple Album</p>
      <p class="footer-copy">
      <p>&copy; <span id="currentYear"></span> | Temple Album | 🦁 Ezequiel Lezcano 🦁 - Argentina</p>
      <p>Last Modified: <span id="lastModified"></span></p>
    </div>
  </footer>

</body>
</html>
